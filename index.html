<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>〇〇なメンバーに回します</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { font-size: 32px; margin-bottom: 20px; color: #333; }
        .metadata { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .video-container { margin: 30px 0; border-radius: 8px; overflow: hidden; background: #000; }
        .video-container iframe { width: 100%; height: 500px; border: none; }
        .video-container video { width: 100%; height: auto; display: block; }
        .dialogue-section { margin-top: 30px; }
        .dialogue-item { margin: 15px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #667eea; border-radius: 4px; }
        .speaker { font-weight: bold; color: #667eea; font-size: 16px; }
        .text { margin-top: 8px; color: #333; line-height: 1.6; }
        small { color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>〇〇なメンバーに回します</h1>
        <div class="metadata">
            <strong>出演メンバー:</strong> ひなぎ, れんと, つばき, ゆめち, ぎる<br>
            <small>作成日: 2026/7/31</small>
        </div>

        <div class="video-container">
            <video width="100%" controls><source src="movie.mp4" type="video/mp4">ブラウザが動画をサポートしていません</video>
        </div>

        <div class="dialogue-section">
            
            <div class="dialogue-item">
                <div class="speaker">ひなぎ</div>
                <div class="text">実は出来る人なのにサボり癖がある人に回します</div>
            </div>
            
            <div class="dialogue-item">
                <div class="speaker">れんと</div>
                <div class="text">5人で居る時終始ボケている人に回します</div>
            </div>
            
            <div class="dialogue-item">
                <div class="speaker">ぎる</div>
                <div class="text">一緒に居て金銭感覚がバグっているラッパーに回します</div>
            </div>
            
            <div class="dialogue-item">
                <div class="speaker">ゆめち</div>
                <div class="text">毎回来るのが遅いのに風紀委員長っぽいこと言う人に回します</div>
            </div>
            
            <div class="dialogue-item">
                <div class="speaker">つばき</div>
                <div class="text">天使のフリをしてメンバーも俺の彼女達も操っている首謀者に回します</div>
            </div>
            
        </div>
    </div>
</body>
</html>
